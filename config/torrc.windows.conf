DataDirectory c:/Users/saghe/Documents/DeepWeb/.tor_runtime/data
HiddenServiceDir c:/Users/saghe/Documents/DeepWeb/.tor_runtime/samubusquedas_hs
HiddenServiceVersion 3
HiddenServicePort 80 127.0.0.1:8080
HiddenServicePort 443 127.0.0.1:8443

# Redundancia máxima de Puntos de Introducción (8 nodos para disponibilidad móvil global)
HiddenServiceNumIntroductionPoints 8
HiddenServiceMaxStreams 500
HiddenServiceMaxStreamsCloseCircuit 0
HiddenServiceEnableIntroDoSDefense 0

# Estabilidad de Circuitos y Prevención de Timeouts en Redes Móviles 4G/5G
LearnCircuitBuildTimeout 0
CircuitBuildTimeout 60
KeepalivePeriod 30
NewCircuitPeriod 30
NumEntryGuards 4

# Desactivar modo Relay/Exit (Solo cliente + Onion Service)
SocksPort 127.0.0.1:19050
ORPort 0
ExitPolicy reject *:*
ClientOnly 1
SafeLogging 0
Log notice file c:/Users/saghe/Documents/DeepWeb/.tor_runtime/tor_bootstrap.log
Log info file c:/Users/saghe/Documents/DeepWeb/.tor_runtime/tor_info.log
