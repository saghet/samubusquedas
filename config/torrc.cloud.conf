# ==============================================================================
# Configuración Tor Cloud (Alta Disponibilidad 24/7 v1.99.13) - "SamuBusquedas"
# Arquitecto: saghet
# Publicación Oficial en la Deep Web sin Depender de la PC Local
# ==============================================================================
DataDirectory /var/lib/tor/data

# Servicio Oculto .onion v3 Oficial en la Nube (saghet)
HiddenServiceDir /var/lib/tor/samubusquedas_hs
HiddenServiceVersion 3
HiddenServicePort 80 127.0.0.1:__PORT__
HiddenServicePort 443 127.0.0.1:8443
HiddenServiceNumIntroductionPoints 8
HiddenServiceMaxStreams 500
HiddenServiceMaxStreamsCloseCircuit 0
HiddenServiceEnableIntroDoSDefense 0

# Estabilidad de Circuitos y Proxy SOCKS5h para Rastreo Seguro e Inteligencia IA
LearnCircuitBuildTimeout 0
CircuitBuildTimeout 60
KeepalivePeriod 30
NewCircuitPeriod 30
NumEntryGuards 4

# Modo cliente + Hidden Service (Sin relay ni exit)
SocksPort 127.0.0.1:19050
ORPort 0
ExitPolicy reject *:*
ClientOnly 1
SafeLogging 0
Log notice stdout
