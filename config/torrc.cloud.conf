# ==============================================================================
# Configuración Tor Cloud (Alta Disponibilidad 24/7 v1.99.6) - "SamuBusquedas"
# Arquitecto: saghet
# ==============================================================================
DataDirectory /var/lib/tor/data
HiddenServiceDir /var/lib/tor/samubusquedas_hs
HiddenServiceVersion 3
HiddenServicePort 80 127.0.0.1:8080

# Redundancia máxima de Puntos de Introducción (6 nodos en vez de 3)
HiddenServiceNumIntroductionPoints 6
HiddenServiceMaxStreams 200
HiddenServiceMaxStreamsCloseCircuit 1

# Estabilidad de Circuitos y Prevención de "Assuming clock jump" al subir descriptor HS
LearnCircuitBuildTimeout 0
CircuitBuildTimeout 30
KeepalivePeriod 45
NewCircuitPeriod 30
NumEntryGuards 4

# Modo cliente + Hidden Service (Sin relay ni exit)
SocksPort 127.0.0.1:19050
ORPort 0
ExitPolicy reject *:*
ClientOnly 1
SafeLogging 0
Log notice stdout
