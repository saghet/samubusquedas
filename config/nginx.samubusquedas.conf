# ==============================================================================
# Configuración Nginx Endurecida (Zero-Logs & Anti-Fingerprinting) - SamuBusquedas
# ==============================================================================
# IMPORTANTE: Nunca escuchar en 0.0.0.0 ni en IPs públicas. Solo en Unix Socket
# o 127.0.0.1 para garantizar que nadie pueda escanear el servidor desde Clearnet.

server {
    listen 127.0.0.1:8081;
    # En producción Linux con socket Unix:
    # listen unix:/run/samubusquedas/web.sock;

    server_name samubusquedas.onion;

    # 1. POLÍTICA ESTRICTA ZERO-LOGS (Protección de Privacidad del Usuario)
    access_log off;
    error_log /dev/null crit;

    # 2. Ocultar versión y firma del servidor web (Evita Fingerprinting del Servidor)
    server_tokens off;
    etag off;
    if_modified_since off;

    # 3. Cabeceras de Blindaje Criptográfico y de Navegador (Zero-JS)
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=()" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

    # 4. Bloquear acceso desde pasarelas Tor2Web en capa de Proxy Inverso
    if ($http_x_tor2web) {
        return 403 "Acceso bloqueado por tu seguridad: No utilices proxies Tor2Web. Descarga Tor Browser oficial.";
    }

    # 5. Límites de tamaño de petición contra ataques de desbordamiento
    client_max_body_size 64k;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 2k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # No reenviar cabeceras de IP real para mantener aislamiento
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
    }
}
