# ==============================================================================
# Archivo de Configuración Endurecido (torrc) para "SamuBusquedas" (.onion v3)
# ==============================================================================
# Propósito: Aislar el servicio oculto, activar defensas criptográficas contra
# denegación de servicio (PoW Equi-X) y evitar fugas de información del servidor.

# 1. Desactivar funciones de Relay y Exit Node (Este nodo es SOLO un Onion Service)
SocksPort 9050 IsolateDestAddr IsolateDestPort
ORPort 0
ExitPolicy reject *:*
ClientOnly 1

# 2. Aislamiento del proceso de Tor a nivel de Kernel (Linux seccomp2 sandbox)
Sandbox 1

# 3.Evitar escribir información sensible en registros de sistema
SafeLogging 1
Log notice file /dev/null

# 4. Configuración del Servicio Oculto "SamuBusquedas" (Versión 3 - Ed25519)
HiddenServiceDir /var/lib/tor/samubusquedas_hidden_service/
HiddenServiceVersion 3

# Redirigir el puerto 80 virtual del dominio .onion al servidor local en 127.0.0.1:8080
# (Alternativamente, usar unix:/run/samubusquedas/web.sock con Nginx)
HiddenServicePort 80 127.0.0.1:8080

# 5. DEFENSA ANTI-DDoS NATIVA CON PROOF-OF-WORK (Equi-X Puzzle - Tor 0.4.8+)
# Protege a SamuBusquedas contra ataques de inundación de puntos de introducción
# sin necesidad de usar CAPTCHAs molestos ni JavaScript.
HiddenServicePoWDefensesEnabled 1
HiddenServicePoWQueueRate 250
HiddenServicePoWQueueBurst 2500

# 6. Límite máximo de circuitos de introducción para mitigar agotamiento de RAM
HiddenServiceMaxStreams 100
HiddenServiceMaxStreamsCloseCircuit 1

# 7. Puerto de Control local para integración con el demonio "Vanguards"
# (Protege contra ataques de descubrimiento de nodos Guardia / Guard Discovery)
ControlPort 127.0.0.1:9051
CookieAuthentication 1
